<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIOTECX - El Poder del Frío</title>
    <link rel="icon" type="image/png" href="tu-logo-friotecx.png">

    <style>
        :root {
            --neon-blue: #00d4ff;
            --frozen-white: #e0f7ff;
            --dark-bg: #0b1a2a;
            --panel-gradient: linear-gradient(180deg, #1a2a3a 0%, #050a0f 100%);
            --border-metal: #7a8a99;
        }

        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- CONTENEDOR DE EFECTOS MÁGICOS (FROZEN STYLE) --- */
        #fx-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1000;
        }

        .snowflake {
            position: absolute; background-color: white; border-radius: 50%;
            opacity: 0.9; box-shadow: 0 0 8px 2px var(--frozen-white);
            animation: fall linear forwards;
        }

        .sparkle {
            position: absolute; background: white; width: 4px; height: 4px;
            border-radius: 50%; box-shadow: 0 0 10px 2px var(--neon-blue);
            animation: twinkle 1s ease-in-out forwards;
        }

        .wind-gust {
            position: absolute; height: 4px;
            background: linear-gradient(to right, transparent, var(--frozen-white), transparent);
            filter: blur(3px); border-radius: 50%;
            animation: gustRunRotate 2s linear forwards;
        }

        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
        @keyframes twinkle {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.5); opacity: 1; }
        }
        @keyframes gustRunRotate {
            0% { transform: translateX(-10vw) rotate(0deg) scaleY(1); opacity: 0; }
            50% { opacity: 0.7; transform: translateX(45vw) rotate(180deg) scaleY(2); }
            100% { transform: translateX(110vw) rotate(360deg) scaleY(1); opacity: 0; }
        }

        /* --- ESTRUCTURA DEL PANEL --- */
        .main-frame {
            width: 95%; max-width: 1100px;
            background: var(--panel-gradient);
            border: 4px solid var(--border-metal);
            border-radius: 15px; padding: 15px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9), 0 10px 40px rgba(0,0,0,0.6);
            position: relative; z-index: 10;
        }

        .top-banner {
            width: 100%; height: 300px;
            border: 2px solid var(--neon-blue);
            border-radius: 10px; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px; background: #000;
        }

        .logo-central { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

        /* ESCANEO LÁSER INICIAL */
        .top-banner::after {
            content: "";
            position: absolute; top: 0; left: -150%;
            width: 60%; height: 100%;
            background: linear-gradient(to right, transparent, var(--frozen-white), var(--neon-blue), transparent);
            transform: skewX(-25deg); z-index: 2;
            animation: iceScan 1.5s ease-in-out forwards;
        }

        @keyframes iceScan { 0% { left: -150%; } 100% { left: 150%; } }

        .dashboard-content {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            background: rgba(0, 0, 0, 0.6); padding: 25px; 
            border: 2px solid var(--border-metal); border-radius: 10px;
        }

        .buttons-column { display: flex; flex-direction: column; gap: 10px; }
        
        .dropbtn {
            background: linear-gradient(180deg, #444, #111);
            border: 1px solid #555; padding: 10px 15px; font-size: 0.85rem; 
            width: 85%; color: #fff; font-weight: bold; cursor: pointer;
            border-radius: 6px; text-align: left; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.3s; outline: none;
        }

        .dropbtn.active { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); }

        .dropdown-content {
            display: none; position: absolute; background-color: #0b1a2a;
            min-width: 260px; z-index: 100; border: 2px solid var(--neon-blue); 
            border-radius: 8px; padding: 15px; left: 0; top: 105%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .show { display: block !important; }

        .info-column { 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; border-left: 2px solid #333; 
        }

        .tasa-box { margin-top: 20px; padding: 20px; background: linear-gradient(145deg, #0b1a2a, #1a2a3a); border: 2px solid var(--neon-blue); border-radius: 10px; width: 80%; }
        .tasa-display { font-size: 1.8rem; font-weight: bold; color: #fff; display: block; margin-top: 10px; }

        .slider-container { width: 95%; max-width: 1100px; overflow: hidden; background: #000; border: 2px solid var(--border-metal); border-radius: 10px; margin-top: 30px; height: 160px; position: relative; z-index: 10; }
        .slider-track { display: flex; width: calc(250px * 14); animation: scroll 35s linear infinite; }
        .slider-track img { width: 250px; height: 150px; object-fit: cover; padding: 5px; opacity: 0.7; cursor: pointer; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-250px * 7)); } }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); padding-top: 50px; }
        .modal-content { margin: auto; display: block; width: 80%; max-width: 900px; border: 3px solid var(--neon-blue); border-radius: 10px; }
        .close-modal { position: absolute; top: 20px; right: 35px; color: #fff; font-size: 40px; cursor: pointer; }

        @media (max-width: 768px) { .dashboard-content { grid-template-columns: 1fr; } .info-column { border-left: none; border-top: 2px solid #333; padding-top: 20px; } }
    </style>
</head>
<body>

    <div id="fx-container"></div>

    <div id="imageModal" class="modal">
        <span class="close-modal" id="closeModal">&times;</span>
        <img class="modal-content" id="imgModalTarget">
    </div>

    <div class="main-frame">
        <div class="top-banner">
            <img src="tu-logo-friotecx.png" alt="FRIOTECX" class="logo-central">
        </div>

        <div class="dashboard-content">
            <div class="buttons-column">
                <div class="dropdown">
                    <button class="dropbtn" onclick="toggleMenu('menu-servicios', this)">☰ SERVICIOS</button>
                    <div id="menu-servicios" class="dropdown-content">
                        <p><strong>Revisión:</strong> $<span class="precio-usd">5</span><span></span></p>
                        <p><strong>Mantenimiento:</strong> $<span class="precio-usd">35</span><span></span></p>
                        <p><strong>Reparación Lavadoras:</strong> $<span class="precio-usd">25</span><span></span></p>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="dropbtn" onclick="toggleMenu('menu-instala', this)">🛠 INSTALACIÓN</button>
                    <div id="menu-instala" class="dropdown-content">
                        <p><strong>Split:</strong> $<span class="precio-usd">60</span><span></span></p>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="dropbtn" onclick="toggleMenu('menu-ubica', this)">📍 UBICACIÓN</button>
                    <div id="menu-ubica" class="dropdown-content">
                        <p>Maracay, Edo. Aragua.</p>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="dropbtn" onclick="toggleMenu('menu-horarios', this)">⏰ HORARIOS</button>
                    <div id="menu-horarios" class="dropdown-content">
                        <p>Lun a Vie: 8am - 6pm</p>
                        <p>Sáb: 9am - 1pm</p>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="dropbtn" onclick="toggleMenu('menu-redes', this)">🌐 REDES</button>
                    <div id="menu-redes" class="dropdown-content">
                        <p>Instagram: @friotecx</p>
                        <p>Facebook: /friotecx</p>
                    </div>
                </div>
            </div>

            <div class="info-column">
                <h4>CONTACTO</h4>
                <p>📞 +58 412-9830982</p>
                <div class="tasa-box">
                    <span class="tasa-label">Dólar Oficial BCV</span>
                    <span id="tasa-display" class="tasa-display">--- BS</span>
                </div>
            </div>
        </div>
    </div>

    <div class="slider-container">
        <div class="slider-track">
            <img src="trabajo1.jpg" onclick="openModal(this)">
            <img src="trabajo2.jpg" onclick="openModal(this)">
            <img src="trabajo3.jpg" onclick="openModal(this)">
            <img src="trabajo4.jpg" onclick="openModal(this)">
            <img src="trabajo5.jpg" onclick="openModal(this)">
        </div>
    </div>

    <script>
        // Funciones de Interfaz
        function toggleMenu(menuId, btn) {
            const todosLosMenus = document.querySelectorAll('.dropdown-content');
            const todosLosBotones = document.querySelectorAll('.dropbtn');
            todosLosMenus.forEach(menu => { if(menu.id !== menuId) menu.classList.remove('show'); });
            todosLosBotones.forEach(b => { if(b !== btn) b.classList.remove('active'); });
            document.getElementById(menuId).classList.toggle('show');
            btn.classList.toggle('active');
        }

        window.onclick = function(e) {
            if (!e.target.matches('.dropbtn')) {
                document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));
                document.querySelectorAll('.dropbtn').forEach(b => b.classList.remove('active'));
            }
        }

        // Tasa del Dólar
        async function actualizarTasa() {
            try {
                const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                const data = await res.json();
                const tasa = data.promedio;
                document.getElementById('tasa-display').innerText = `${tasa.toFixed(2)} BS`;
                document.querySelectorAll('.precio-usd').forEach(el => {
                    const usd = parseFloat(el.innerText);
                    const bs = (usd * tasa).toLocaleString('es-VE', {minimumFractionDigits: 2});
                    el.nextElementSibling.innerText = ` / ${bs} BS`;
                });
            } catch (e) { console.log("Error tasa"); }
        }
        actualizarTasa();

        // Modal de Imágenes
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('imgModalTarget');
        function openModal(element) { modal.style.display = "block"; modalImg.src = element.src; }
        document.getElementById('closeModal').onclick = function() { modal.style.display = "none"; }

        // --- LÓGICA MÁGICA FROZEN ---
        const fxContainer = document.getElementById('fx-container');

        function crearCopo() {
            const copo = document.createElement('div');
            copo.classList.add('snowflake');
            const tam = Math.random() * 5 + 2;
            copo.style.width = tam + 'px'; copo.style.height = tam + 'px';
            copo.style.left = Math.random() * 100 + 'vw';
            const dur = Math.random() * 5 + 5;
            copo.style.animationDuration = dur + 's';
            fxContainer.appendChild(copo);
            setTimeout(() => copo.remove(), dur * 1000);
        }

        function crearChispa() {
            const chispa = document.createElement('div');
            chispa.classList.add('sparkle');
            chispa.style.left = Math.random() * 100 + 'vw';
            chispa.style.top = Math.random() * 100 + 'vh';
            fxContainer.appendChild(chispa);
            setTimeout(() => chispa.remove(), 1000);
        }

        function dispararViento() {
            const rafaga = document.createElement('div');
            rafaga.classList.add('wind-gust');
            rafaga.style.width = (Math.random() * 150 + 100) + 'px';
            rafaga.style.top = Math.random() * 90 + 'vh';
            fxContainer.appendChild(rafaga);
            setTimeout(() => rafaga.remove(), 2000);
        }

        // Iniciar efectos después del láser
        setTimeout(() => {
            setInterval(crearCopo, 250); 
            setInterval(crearChispa, 500); 
            setInterval(() => {
                const num = Math.floor(Math.random() * 2) + 1;
                for(let i=0; i<num; i++) setTimeout(dispararViento, i*400);
            }, 4000);
        }, 1500);
    </script>
</body>
</html>
